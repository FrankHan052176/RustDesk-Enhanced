name: Windows controlled host

# The Windows controlled-side backend compiles only on Windows, so this is the
# only job that can prove the SendInput module builds and its tests pass.

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/windows-host.yml
      - crates/rd-engine/**
      - libs/hbb_common/**
  pull_request:
    paths:
      - .github/workflows/windows-host.yml
      - crates/rd-engine/**
      - libs/hbb_common/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never

jobs:
  windows-host:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/rd-engine
      - name: Check formatting
        run: cargo fmt --check --manifest-path crates/rd-engine/Cargo.toml
      - name: Test the whole engine on Windows
        run: cargo test --locked --manifest-path crates/rd-engine/Cargo.toml
      - name: Build the controlled host binary
        run: >-
          cargo build --locked --release --bin rd-engine-windows-host
          --manifest-path crates/rd-engine/Cargo.toml
