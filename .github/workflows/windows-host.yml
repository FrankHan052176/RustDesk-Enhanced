name: Windows controlled host

# The Windows controlled-side backend compiles only on Windows, so this is the
# only job that can prove the SendInput module builds and its tests pass.

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/windows-host.yml
      - crates/rd-engine/**
      - libs/hbb_common/**
  pull_request:
    paths:
      - .github/workflows/windows-host.yml
      - crates/rd-engine/**
      - libs/hbb_common/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never

jobs:
  windows-host:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/rd-engine
      - name: Check formatting
        run: cargo fmt --check --manifest-path crates/rd-engine/Cargo.toml
      - name: Test the whole engine on Windows
        run: cargo test --locked --manifest-path crates/rd-engine/Cargo.toml
      - name: Build the controlled host binary
        run: >-
          cargo build --locked --release --bin rd-engine-windows-host
          --manifest-path crates/rd-engine/Cargo.toml
      # A Windows host build cannot be produced anywhere else, so without this
      # step the only artefact of the job is a runner-local file that the
      # controlled machine can never obtain.
      - name: Package the controlled host binary
        shell: pwsh
        run: |
          $src = "crates/rd-engine/target/release/rd-engine-windows-host.exe"
          if (-not (Test-Path $src)) { throw "missing $src" }
          $out = "dist/windows-host"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item $src "$out/rd-engine-windows-host.exe"
          # The host reads its identity and options from files beside it, so the
          # packaging step records exactly what was built for the operator.
          $hash = (Get-FileHash "$out/rd-engine-windows-host.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  rd-engine-windows-host.exe" | Set-Content "$out/SHA256SUMS" -Encoding ascii
          "commit=$env:GITHUB_SHA" | Set-Content "$out/BUILD-INFO.txt" -Encoding ascii
      - name: Upload the controlled host binary
        uses: actions/upload-artifact@v4
        with:
          name: rd-engine-windows-host-${{ github.sha }}
          path: dist/windows-host
          if-no-files-found: error
