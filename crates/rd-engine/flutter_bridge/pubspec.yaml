name: rustdesk_bridge
description: Dart dependencies required to generate the Flutter Rust bridge.
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"

# Versions are pinned to what flutter_rust_bridge 1.80.1 requires: it depends on
# `uuid ^3.0.6`, so a uuid 4 constraint cannot resolve.
dependencies:
  flutter_rust_bridge: 1.80.1
  uuid: ^3.0.7
  ffi: ">=2.0.1 <3.0.0"
  freezed_annotation: ^2.4.1

dev_dependencies:
  ffigen: ">=8.0.0 <9.0.0"
  build_runner: ^2.4.0
  freezed: ^2.4.0
